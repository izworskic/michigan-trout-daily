name: Daily Trout Report

on:
  schedule:
    # The Vercel publisher targets the 4-5am EST / 5-6am EDT hour. These are
    # timezone-aware safety runs after it, with a second chance for queue delay
    # or a transient upstream failure. WordPress content checks make both safe.
    - cron: '17 6 * * *'
      timezone: 'America/Detroit'
    - cron: '47 7 * * *'
      timezone: 'America/Detroit'
  workflow_dispatch:
    inputs:
      river_override:
        description: 'Force a specific river slug (skips rotation/recency)'
        required: false
        default: ''
      dry_run:
        description: 'Print the post but do not publish'
        required: false
        default: 'false'

concurrency:
  group: michigan-trout-daily-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Publish daily post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_TOKEN: ${{ secrets.WP_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          RIVER_OVERRIDE: ${{ github.event.inputs.river_override }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish.py

      - name: Verify today's real report is live
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python scripts/verify_today.py
